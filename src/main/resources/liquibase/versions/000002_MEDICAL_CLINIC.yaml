databaseChangeLog:
  - changeSet:
      id: 2
      author: ryszard
      changes:
        - createTable:
            tableName: INSTITUTION
            columns:
              - column:
                  name: ID
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: NAME
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
